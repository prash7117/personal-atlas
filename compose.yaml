services:
  qdrant:
    image: qdrant/qdrant:v1.16.2
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  rag-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-my_rag}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      RAG_DATA_DIR: /app/data
      RAG_STATE_PATH: /app/data/.rag_ingest_state.json
      RAG_LOCK_PATH: /app/data/.rag_ingest.lock
      RAG_REPO_GROUPS_PATH: /app/data/repo_groups.json
      RAG_SETTINGS_PATH: /app/data/settings.json
      RAG_ALLOWED_INGEST_ROOTS: /data/input
    volumes:
      - app_data:/app/data
      - ./data/input:/data/input

volumes:
  qdrant_data:
  app_data:
